<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control de Asistencia</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --azul-fuerte: #1565C0;
      --azul-medio: #1976D2;
      --azul-claro: #42A5F5;
      --azul-bajo: #BBDEFB;
      --gris-claro: #ECEFF1;
      --gris-medio: #B0BEC5;
      --gris-oscuro: #546E7A;
      --blanco: #FFFFFF;
      --verde-menta: #A8D8B9;
      --verde-menta-oscuro: #80C59A;
      --verde-menta-claro: #D4EFE0;
      --rojo: #E53935;
      --naranja: #FB8C00;
      --verde-ok: #43A047;
      --sombra: 0 4px 20px rgba(21, 101, 192, 0.15);
      --sombra-hover: 0 8px 30px rgba(21, 101, 192, 0.25);
      --radio: 14px;
      --radio-sm: 8px;
      --radio-lg: 20px;
    }
    
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--verde-menta);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(168, 216, 185, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(187, 222, 251, 0.4) 0%, transparent 50%);
      min-height: 100vh;
      color: #263238;
    }
    
    /* ========== HEADER ========== */
    .header {
      background: var(--azul-fuerte);
      background-image: linear-gradient(135deg, var(--azul-fuerte) 0%, var(--azul-medio) 60%, var(--azul-claro) 100%);
      color: var(--blanco);
      padding: 0;
      box-shadow: 0 4px 20px rgba(21, 101, 192, 0.4);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    
    .logo-icon {
      font-size: 2.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    
    .header-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
    }
    
    .header-subtitle {
      font-size: 0.78rem;
      opacity: 0.8;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    
    .header-date {
      font-size: 0.9rem;
      background: rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: var(--radio-sm);
      font-weight: 600;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    /* ========== SEARCH ========== */
    .search-section {
      max-width: 1400px;
      margin: 22px auto 0;
      padding: 0 28px;
    }
    
    .search-wrapper {
      display: flex;
      align-items: center;
      background: var(--blanco);
      border-radius: var(--radio-lg);
      box-shadow: var(--sombra);
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .search-wrapper:focus-within {
      border-color: var(--azul-claro);
      box-shadow: var(--sombra-hover);
    }
    
    .search-icon {
      padding: 0 14px 0 18px;
      font-size: 1.1rem;
      color: var(--gris-oscuro);
    }
    
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Nunito', sans-serif;
      font-size: 0.98rem;
      padding: 14px 0;
      color: #263238;
      background: transparent;
    }
    
    .search-input::placeholder { color: var(--gris-medio); }
    
    .search-clear {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 18px;
      font-size: 1rem;
      color: var(--gris-medio);
      transition: color 0.2s;
    }
    .search-clear:hover { color: var(--rojo); }
    
    /* ========== NAV BUTTONS ========== */
    .nav-buttons {
      max-width: 1400px;
      margin: 18px auto;
      padding: 0 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 11px 18px;
      border-radius: var(--radio);
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .btn-gray {
      background: var(--gris-claro);
      color: var(--gris-oscuro);
      border: 1.5px solid var(--gris-medio);
    }
    .btn-gray:hover, .btn-gray.active {
      background: var(--azul-fuerte);
      color: var(--blanco);
      border-color: var(--azul-fuerte);
      transform: translateY(-2px);
      box-shadow: var(--sombra-hover);
    }
    
    .btn-download {
      background: var(--verde-ok);
      color: var(--blanco);
      border: 1.5px solid transparent;
      margin-left: auto;
    }
    .btn-download:hover {
      background: #2E7D32;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 160, 71, 0.4);
    }
    
    .btn-icon { font-size: 1rem; }
    
    /* ========== MAIN CONTAINER ========== */
    .main-container {
      max-width: 1400px;
      margin: 0 auto 40px;
      padding: 0 28px;
    }
    
    /* ========== CONTENT PANEL ========== */
    .content-panel {
      background: var(--azul-fuerte);
      background-image: linear-gradient(160deg, var(--azul-fuerte) 0%, var(--azul-medio) 100%);
      border-radius: var(--radio-lg);
      box-shadow: var(--sombra-hover);
      overflow: hidden;
      animation: panelIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    
    .panel-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--blanco);
      letter-spacing: 0.5px;
    }
    
    .panel-count {
      background: rgba(255,255,255,0.2);
      color: var(--blanco);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    
    .panel-body {
      padding: 22px 28px;
      min-height: 320px;
    }
    
    /* ========== WELCOME ========== */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 14px;
      color: rgba(255,255,255,0.85);
    }
    .welcome-icon { font-size: 3.5rem; }
    .welcome-screen h3 { font-size: 1.3rem; font-weight: 700; }
    .welcome-screen p { font-size: 0.95rem; opacity: 0.75; }
    
    /* ========== STUDENT LIST ========== */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .student-card {
      background: var(--gris-claro);
      border-radius: var(--radio);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.2s ease;
      border: 1.5px solid rgba(255,255,255,0.6);
      animation: cardIn 0.25s ease forwards;
      opacity: 0;
    }
    
    @keyframes cardIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .student-card:hover {
      background: var(--blanco);
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(21,101,192,0.15);
    }
    
    .student-info { flex: 1; }
    
    .student-name {
      font-weight: 800;
      font-size: 0.97rem;
      color: #1A237E;
    }
    
    .student-meta {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    
    .student-group {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--azul-fuerte);
      color: var(--blanco);
      padding: 2px 9px;
      border-radius: 20px;
    }
    
    .student-date {
      font-size: 0.78rem;
      color: var(--gris-oscuro);
      font-weight: 600;
    }
    
    .student-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .badge {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 700;
    }
    .badge-ok { background: #C8E6C9; color: #2E7D32; }
    .badge-no { background: #FFCDD2; color: #C62828; }
    .badge-retardo { background: #FFF9C4; color: #F57F17; }
    .badge-falta { background: #FFCDD2; color: #C62828; }
    
    .btn-historial {
      background: var(--azul-medio);
      color: var(--blanco);
      border: none;
      padding: 8px 14px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-historial:hover {
      background: var(--azul-fuerte);
      transform: scale(1.04);
      box-shadow: 0 4px 12px rgba(21,101,192,0.3);
    }
    
    /* ========== REGISTRAR SECTION ========== */
    .registrar-section { display: flex; flex-direction: column; gap: 18px; }
    
    .registrar-search-box {
      background: rgba(255,255,255,0.1);
      border-radius: var(--radio);
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .registrar-search-box label {
      display: block;
      color: var(--blanco);
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .registrar-search-input {
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--radio-sm);
      border: 2px solid rgba(255,255,255,0.3);
      background: var(--blanco);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .registrar-search-input:focus { border-color: var(--azul-claro); }
    
    .register-results { display: flex; flex-direction: column; gap: 10px; }
    
    .register-card {
      background: var(--gris-claro);
      border-radius: var(--radio);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border: 1.5px solid rgba(255,255,255,0.6);
      animation: cardIn 0.25s ease forwards;
      opacity: 0;
    }
    
    .register-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #1A237E;
      min-width: 220px;
      flex: 1;
    }
    
    .register-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .check-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--blanco);
      border: 2px solid var(--gris-medio);
      border-radius: var(--radio-sm);
      padding: 7px 12px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gris-oscuro);
      transition: all 0.2s;
    }
    
    .check-btn input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--azul-fuerte);
      cursor: pointer;
    }
    
    .check-btn.checked {
      border-color: var(--verde-ok);
      background: #E8F5E9;
      color: #2E7D32;
    }
    
    .btn-save {
      background: var(--verde-ok);
      color: var(--blanco);
      border: none;
      padding: 8px 14px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save:hover { background: #2E7D32; transform: scale(1.04); }
    
    .btn-ver-historial {
      background: var(--azul-medio);
      color: var(--blanco);
      border: none;
      padding: 8px 12px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ver-historial:hover { background: var(--azul-fuerte); }
    
    /* ========== NO REGISTRADOS SECTION ========== */
    .no-reg-card {
      background: var(--gris-claro);
      border-radius: var(--radio);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      border: 1.5px solid rgba(255,255,255,0.6);
      animation: cardIn 0.25s ease forwards;
      opacity: 0;
    }
    
    .no-reg-info { flex: 1; }
    .no-reg-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #1A237E;
    }
    .no-reg-group {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--azul-fuerte);
      color: var(--blanco);
      padding: 2px 9px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    
    .no-reg-actions { display: flex; gap: 8px; }
    
    .btn-retardo {
      background: #FFF9C4;
      color: #F57F17;
      border: 2px solid #FBC02D;
      padding: 7px 12px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-retardo:hover { background: #FBC02D; color: var(--blanco); }
    
    .btn-faltante {
      background: #FFCDD2;
      color: #C62828;
      border: 2px solid #EF9A9A;
      padding: 7px 12px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-faltante:hover { background: #EF9A9A; color: var(--blanco); }
    
    /* ========== MODAL ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(21,101,192,0.45);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    
    .modal-box {
      background: var(--blanco);
      border-radius: var(--radio-lg);
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(21,101,192,0.3);
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    .modal-header {
      background: var(--azul-fuerte);
      color: var(--blanco);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .modal-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: var(--blanco);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); }
    
    .modal-body {
      padding: 22px 24px;
      overflow-y: auto;
    }
    
    /* ========== HISTORIAL TABLE ========== */
    .historial-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .historial-table th {
      background: var(--azul-bajo);
      color: var(--azul-fuerte);
      font-weight: 800;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.82rem;
      letter-spacing: 0.3px;
    }
    .historial-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #ECEFF1;
      color: #263238;
    }
    .historial-table tr:last-child td { border-bottom: none; }
    .historial-table tr:hover td { background: var(--verde-menta-claro); }
    
    /* ========== EMPTY STATE ========== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 50px 20px;
      color: rgba(255,255,255,0.7);
    }
    .empty-state-icon { font-size: 2.8rem; }
    .empty-state p { font-size: 0.95rem; }
    
    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--azul-fuerte);
      color: var(--blanco);
      padding: 12px 22px;
      border-radius: var(--radio);
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--sombra-hover);
      z-index: 2000;
      animation: toastIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--gris-claro); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--azul-claro); border-radius: 10px; }
    
    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header-inner { padding: 12px 16px; }
      .header-title { font-size: 1.3rem; }
      .header-date { display: none; }
      .search-section, .nav-buttons, .main-container { padding: 0 12px; }
      .nav-buttons { gap: 7px; }
      .nav-btn { font-size: 0.8rem; padding: 9px 13px; }
      .panel-body { padding: 16px; }
      .register-card { flex-direction: column; align-items: flex-start; }
    }
    /* ========== PERFIL / MÁS INFO ========== */
    .info-perfil-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    @media (max-width: 520px) { .info-perfil-grid { grid-template-columns: 1fr; } }
    
    .info-dato {
      background: #F5F7FA;
      border-radius: var(--radio-sm);
      padding: 10px 14px;
      border-left: 3px solid var(--azul-claro);
    }
    .info-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--gris-oscuro);
      margin-bottom: 3px;
    }
    .info-valor {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1A237E;
    }
    
    .info-stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .info-stat {
      flex: 1;
      min-width: 70px;
      border-radius: var(--radio-sm);
      padding: 12px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .info-stat-num { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .info-stat-lbl { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .info-stat-ok      { background: #E8F5E9; color: #2E7D32; }
    .info-stat-warn    { background: #FFF9C4; color: #F57F17; }
    .info-stat-danger  { background: #FFEBEE; color: #C62828; }
    .info-stat-neutral { background: #E3F2FD; color: #1565C0; }
    
    /* ========== FORMULARIO AGREGAR ALUMNO ========== */
    .form-alumno-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    @media (max-width: 520px) { .form-alumno-grid { grid-template-columns: 1fr; } }
    
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field-full { grid-column: 1 / -1; }
    
    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--gris-oscuro);
    }
    .form-input {
      padding: 10px 14px;
      border-radius: var(--radio-sm);
      border: 2px solid var(--gris-medio);
      font-family: 'Nunito', sans-serif;
      font-size: 0.93rem;
      color: #263238;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #FAFAFA;
    }
    .form-input:focus {
      border-color: var(--azul-claro);
      box-shadow: 0 0 0 3px rgba(66,165,245,0.15);
      background: #fff;
    }
    
    .btn-save-full {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: var(--radio);
      display: block;
      text-align: center;
      margin-top: 4px;
    }
    
    /* Botón Más info */
    .btn-mas-info {
      background: #E3F2FD;
      color: #1565C0;
      border: 2px solid #90CAF9;
      padding: 8px 14px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-mas-info:hover {
      background: #1565C0;
      color: #fff;
      border-color: #1565C0;
      transform: scale(1.04);
    }
    
    /* Botón Eliminar */
    .btn-eliminar {
      background: #FFEBEE;
      color: #C62828;
      border: 2px solid #EF9A9A;
      padding: 8px 14px;
      border-radius: var(--radio-sm);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-eliminar:hover {
      background: #C62828;
      color: #fff;
      border-color: #C62828;
      transform: scale(1.04);
    }
  </style>
  <body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">🎓</span>
        <div>
          <h1 class="header-title">Control de Asistencia</h1>
          <p class="header-subtitle">Sistema Escolar de Registro</p>
        </div>
      </div>
      <div class="header-date" id="headerDate"></div>
    </div>
  </header>

  <!-- SEARCH BAR -->
  <div class="search-section">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar alumno por nombre, apellido o grupo...">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- NAVIGATION BUTTONS -->
  <nav class="nav-buttons">
    <button class="nav-btn btn-gray" onclick="showPanel('sinCredencial')">
      <span class="btn-icon">🪪</span> Sin Credencial
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('sinUniforme')">
      <span class="btn-icon">👕</span> Sin Uniforme
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('enPlantel')">
      <span class="btn-icon">🏫</span> Alumnos en la Institución
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('todosRegistrados')">
      <span class="btn-icon">📋</span> Todos los Alumnos
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('registrar')">
      <span class="btn-icon">✏️</span> Registrar Alumnos
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('noRegistrados')">
      <span class="btn-icon">⏳</span> Aún No Registrados
    </button>
    <button class="nav-btn btn-gray" onclick="showPanel('faltantes')">
      <span class="btn-icon">❌</span> Alumnos Faltantes
    </button>
    <button class="nav-btn btn-gray" onclick="mostrarFormularioAlumno()">
      <span class="btn-icon">➕</span> Agregar Alumno
    </button>
    <button class="nav-btn btn-download" onclick="exportarExcel()">
      <span class="btn-icon">📥</span> Descargar Excel
    </button>
  </nav>

  <!-- MAIN PANEL -->
  <main class="main-container">
    <section class="content-panel" id="contentPanel">
      <div class="panel-header">
        <h2 class="panel-title" id="panelTitle">Bienvenido al Sistema</h2>
        <span class="panel-count" id="panelCount"></span>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="welcome-screen">
          <div class="welcome-icon">🎓</div>
          <h3>Sistema de Control de Asistencia</h3>
          <p>Selecciona una opción del menú para comenzar.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL HISTORIAL -->
  <div class="modal-overlay" id="modalHistorial" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">Historial del Alumno</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- MODAL AGREGAR ALUMNO -->
  <div class="modal-overlay" id="modalAlumno" onclick="cerrarModalAlumno()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>➕ Agregar Nuevo Alumno</h3>
        <button class="modal-close" onclick="cerrarModalAlumno()">✕</button>
      </div>

      <div class="modal-body">
        <div class="form-alumno-grid">
          <div class="form-field">
            <label class="form-label">Apellido Paterno *</label>
            <input type="text" id="nuevoApPaterno" class="form-input" placeholder="Ej. García">
          </div>
          <div class="form-field">
            <label class="form-label">Apellido Materno *</label>
            <input type="text" id="nuevoApMaterno" class="form-input" placeholder="Ej. López">
          </div>
          <div class="form-field">
            <label class="form-label">Nombre(s) *</label>
            <input type="text" id="nuevoNombre" class="form-input" placeholder="Ej. Carlos Andrés">
          </div>
          <div class="form-field">
            <label class="form-label">Grupo</label>
            <input type="text" id="nuevoGrupo" class="form-input" placeholder="Ej. 3D1">
          </div>
          <div class="form-field form-field-full">
            <label class="form-label">CURP</label>
            <input type="text" id="nuevoCurp" class="form-input" placeholder="Ej. GARL050312HMCXXX00" maxlength="18" style="text-transform:uppercase">
          </div>
          <div class="form-field form-field-full">
            <label class="form-label">Número de Control</label>
            <input type="text" id="nuevoControl" class="form-input" placeholder="Ej. 2024-001">
          </div>
        </div>
        <p style="font-size:0.78rem;color:#90A4AE;margin-bottom:16px;">* Campos obligatorios</p>
        <button class="btn-save btn-save-full" onclick="guardarNuevoAlumno()">
          💾 Guardar Alumno
        </button>
      </div>
    </div>
  </div>
    
  <script>
    // ============================================================
    // APP.JS — Lógica principal del sistema de asistencia
    // ============================================================
    
    let currentPanel = '';
    let searchTimer = null;
    
    // ---------- INICIALIZACIÓN ----------
    document.addEventListener('DOMContentLoaded', () => {
      // Fecha en header
      const now = new Date();
      document.getElementById('headerDate').textContent =
        now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    
      // Buscar en tiempo real
      document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => applySearch(e.target.value), 250);
      });
    });
    
    // ---------- BUSCAR ----------
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      applySearch('');
    }
    
    function applySearch(query) {
      if (!currentPanel) return;
      showPanel(currentPanel, query.trim().toLowerCase());
    }
    
    // ---------- MOSTRAR PANEL ----------
    function showPanel(tipo, filtro = '') {
      currentPanel = tipo;
      // Actualizar botón activo
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event && event.target && event.target.closest('.nav-btn') &&
        event.target.closest('.nav-btn').classList.add('active');
    
      const registros = getRegistros();
      let alumnos = [];
      let titulo = '';
      let renderFn = renderListaAlumnos;
    
      switch(tipo) {
        case 'sinCredencial':
          titulo = '🪪 Alumnos Sin Credencial';
          alumnos = sortAlumnos(
            ALUMNOS_BASE.filter(a => {
              const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
              return r && r.asistencia !== 'falta' && r.credencial === false;
            })
          );
          break;
    
        case 'sinUniforme':
          titulo = '👕 Alumnos Sin Uniforme';
          alumnos = sortAlumnos(
            ALUMNOS_BASE.filter(a => {
              const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
              return r && r.asistencia !== 'falta' && r.uniforme === false;
            })
          );
          break;
    
        case 'enPlantel':
          titulo = '🏫 Alumnos en la Institución';
          alumnos = sortAlumnos(
            ALUMNOS_BASE.filter(a => {
              const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
              return r && (r.asistencia === 'presente' || r.asistencia === 'retardo');
            })
          );
          break;
    
        case 'todosRegistrados':
          titulo = '📋 Todos los Alumnos (por Semestre)';
          alumnos = sortPorSemestre(ALUMNOS_BASE);
          renderFn = renderListaTodos;
          break;
    
        case 'faltantes':
          titulo = '❌ Alumnos Faltantes';
          alumnos = sortAlumnos(
            ALUMNOS_BASE.filter(a => {
              const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
              return r && r.asistencia === 'falta';
            })
          );
          break;
    
        case 'registrar':
          titulo = '✏️ Registrar Alumnos';
          renderRegistrarPanel(filtro);
          return;
    
        case 'noRegistrados':
          titulo = '⏳ Alumnos Aún No Registrados';
          alumnos = sortAlumnos(
            ALUMNOS_BASE.filter(a => !registros.find(r => r.alumnoId === a.id && r.fecha === HOY))
          );
          renderNoRegistradosPanel(alumnos, filtro, titulo);
          return;
      }
    
      // Aplicar filtro de búsqueda
      if (filtro) {
        alumnos = alumnos.filter(a =>
          nombreCompleto(a).toLowerCase().includes(filtro) ||
          a.grupo.toLowerCase().includes(filtro)
        );
      }
    
      setPanelHeader(titulo, alumnos.length);
      const html = alumnos.length === 0
        ? emptyState()
        : renderFn(alumnos, registros);
      document.getElementById('panelBody').innerHTML = html;
      animateCards();
    }
    
    // ---------- RENDER LISTA BÁSICA ----------
    function renderListaAlumnos(alumnos, registros) {
      return `<div class="student-list">${alumnos.map(a => {
        const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
        return studentCard(a, r);
      }).join('')}</div>`;
    }
    
    function studentCard(a, r) {
      const asistBadge = r ? badgeAsistencia(r.asistencia) : '';
      const credBadge = r ? `<span class="badge ${r.credencial ? 'badge-ok' : 'badge-no'}">${r.credencial ? '✓ Credencial' : '✗ Credencial'}</span>` : '';
      const unifBadge = r ? `<span class="badge ${r.uniforme ? 'badge-ok' : 'badge-no'}">${r.uniforme ? '✓ Uniforme' : '✗ Uniforme'}</span>` : '';
    
      return `
      <div class="student-card">
        <div class="student-info">
          <div class="student-name">${nombreCompleto(a)}</div>
          <div class="student-meta">
            <span class="student-group">${a.grupo}</span>
            ${r ? `<span class="student-date">📅 ${r.fecha}</span>` : ''}
            ${asistBadge}${credBadge}${unifBadge}
          </div>
        </div>
    
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-historial" onclick="verHistorial(${a.id})">
            📜 Historial
          </button>
          <button class="btn-mas-info" onclick="mostrarMasInfo(${a.id})">
            ℹ️ Más info
          </button>
          <button class="btn-eliminar" onclick="borrarAlumno(${a.id})">
            🗑 Eliminar
          </button>
        </div>
      </div>`;
    }
    
    // ---------- RENDER LISTA TODOS (por semestre) ----------
    function renderListaTodos(alumnos, registros) {
      let html = '<div class="student-list">';
      let grupoActual = '';
      alumnos.forEach(a => {
        if (a.grupo !== grupoActual) {
          grupoActual = a.grupo;
          html += `<div style="color:#BBDEFB;font-weight:800;font-family:'Rajdhani',sans-serif;
                   font-size:1.05rem;padding:10px 4px 4px;letter-spacing:1px;
                   border-bottom:1px solid rgba(255,255,255,0.2);margin-bottom:4px;">
                   🗂 Grupo ${grupoActual}</div>`;
        }
        const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
        html += studentCard(a, r);
      });
      html += '</div>';
      return html;
    }
    
    // ---------- RENDER REGISTRAR ----------
    function renderRegistrarPanel(filtro = '') {
      setPanelHeader('✏️ Registrar Alumnos', null);
      const registros = getRegistros();
    
      let alumnosFiltrados = ALUMNOS_BASE;
      if (filtro) {
        alumnosFiltrados = ALUMNOS_BASE.filter(a =>
          nombreCompleto(a).toLowerCase().includes(filtro) ||
          a.grupo.toLowerCase().includes(filtro)
        );
      }
    
      let cardsHTML = '';
      if (alumnosFiltrados.length > 0) {
        cardsHTML = alumnosFiltrados.map(a => {
          const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY) || {};
          const asistChecked = r.asistencia === 'presente' ? 'checked' : '';
          const credChecked = r.credencial ? 'checked' : '';
          const unifChecked = r.uniforme ? 'checked' : '';
          return `
          <div class="register-card" id="regcard-${a.id}">
            <div class="register-name">${nombreCompleto(a)} <span style="font-size:0.78rem;font-weight:600;
              background:var(--azul-fuerte);color:#fff;padding:2px 8px;border-radius:20px;
              margin-left:6px;">${a.grupo}</span></div>
            <div class="register-actions">
              <label class="check-btn ${r.asistencia === 'presente' || r.asistencia === 'retardo' ? 'checked' : ''}" id="lbl-asist-${a.id}">
                <input type="checkbox" id="chk-asist-${a.id}" ${asistChecked}
                  onchange="updateCheckStyle(${a.id},'asist')"> 🏫 Asistencia
              </label>
              <label class="check-btn ${r.credencial ? 'checked' : ''}" id="lbl-cred-${a.id}">
                <input type="checkbox" id="chk-cred-${a.id}" ${credChecked}
                  onchange="updateCheckStyle(${a.id},'cred')"> 🪪 Credencial
              </label>
              <label class="check-btn ${r.uniforme ? 'checked' : ''}" id="lbl-unif-${a.id}">
                <input type="checkbox" id="chk-unif-${a.id}" ${unifChecked}
                  onchange="updateCheckStyle(${a.id},'unif')"> 👕 Uniforme
              </label>
              <button class="btn-save" onclick="guardarAlumno(${a.id})">💾 Guardar</button>
              <button class="btn-ver-historial" onclick="verHistorial(${a.id})">📜 Historial</button>
            </div>
          </div>`;
        }).join('');
      } else {
        cardsHTML = '<div style="color:rgba(255,255,255,0.6);text-align:center;padding:30px;">No se encontraron alumnos.</div>';
      }
    
      document.getElementById('panelBody').innerHTML = `
      <div class="registrar-section">
        <div class="registrar-search-box">
          <label>🔎 Buscar alumno para registrar:</label>
          <input type="text" class="registrar-search-input" id="regSearch"
            placeholder="Escribe nombre, apellido o grupo..."
            value="${filtro}"
            oninput="buscarParaRegistrar(this.value)">
        </div>
        <div class="register-results">${cardsHTML}</div>
      </div>`;
      animateCards();
    }
    
    function buscarParaRegistrar(val) {
      renderRegistrarPanel(val.trim().toLowerCase());
    }
    
    function updateCheckStyle(id, tipo) {
      const map = { asist: 'asist', cred: 'cred', unif: 'unif' };
      const chkId = `chk-${tipo === 'asist' ? 'asist' : tipo === 'cred' ? 'cred' : 'unif'}-${id}`;
      const lblId = `lbl-${tipo === 'asist' ? 'asist' : tipo === 'cred' ? 'cred' : 'unif'}-${id}`;
      const chk = document.getElementById(chkId);
      const lbl = document.getElementById(lblId);
      if (chk && lbl) lbl.classList.toggle('checked', chk.checked);
    }
    
    function guardarAlumno(id) {
      const asist = document.getElementById(`chk-asist-${id}`)?.checked;
      const cred = document.getElementById(`chk-cred-${id}`)?.checked;
      const unif = document.getElementById(`chk-unif-${id}`)?.checked;
      const asistVal = asist ? 'presente' : 'falta';
      guardarRegistro(id, asistVal, cred || false, unif || false);
      showToast('✅ Registro guardado correctamente');
    }
    
    // ---------- RENDER NO REGISTRADOS ----------
    function renderNoRegistradosPanel(alumnos, filtro, titulo) {
      let lista = alumnos;
      if (filtro) {
        lista = lista.filter(a =>
          nombreCompleto(a).toLowerCase().includes(filtro) ||
          a.grupo.toLowerCase().includes(filtro)
        );
      }
    
      setPanelHeader(titulo, lista.length);
      if (lista.length === 0) {
        document.getElementById('panelBody').innerHTML = emptyState('¡Todos los alumnos han sido registrados hoy!');
        return;
      }
    
      const html = `<div class="student-list">${lista.map(a => `
        <div class="no-reg-card">
          <div class="no-reg-info">
            <div class="no-reg-name">${nombreCompleto(a)}</div>
            <span class="no-reg-group">${a.grupo}</span>
          </div>
          <div class="no-reg-actions">
            <button class="btn-retardo" onclick="registrarRetardo(${a.id})">⏰ Registrar Retardo</button>
            <button class="btn-faltante" onclick="registrarFalta(${a.id})">❌ Marcar Faltante</button>
            <button class="btn-historial" onclick="verHistorial(${a.id})">📜 Historial</button>
          </div>
        </div>`).join('')}</div>`;
    
      document.getElementById('panelBody').innerHTML = html;
      animateCards();
    }
    
    function registrarRetardo(id) {
      guardarRegistro(id, 'retardo', false, false);
      showToast('⏰ Alumno registrado con retardo');
      showPanel('noRegistrados');
    }
    
    function registrarFalta(id) {
      guardarRegistro(id, 'falta', false, false);
      showToast('❌ Alumno marcado como faltante');
      showPanel('noRegistrados');
    }
    
    // ---------- HISTORIAL ----------
    function verHistorial(alumnoId) {
      const alumno = ALUMNOS_BASE.find(a => a.id === alumnoId);
      if (!alumno) return;
    
      const historial = getHistorial().filter(h => h.alumnoId === alumnoId);
    
      document.getElementById('modalTitle').textContent = `📜 Historial — ${nombreCompleto(alumno)}`;
    
      if (historial.length === 0) {
        document.getElementById('modalBody').innerHTML =
          '<p style="color:#546E7A;text-align:center;padding:20px;">No hay registros previos para este alumno.</p>';
      } else {
        const filas = historial
          .sort((a, b) => new Date(b.fecha.split('/').reverse().join('-')) - new Date(a.fecha.split('/').reverse().join('-')))
          .map(h => `
          <tr>
            <td>📅 ${h.fecha}</td>
            <td>${badgeAsistenciaText(h.asistencia)}</td>
            <td>${h.credencial ? '✅ Sí' : '❌ No'}</td>
            <td>${h.uniforme ? '✅ Sí' : '❌ No'}</td>
          </tr>`).join('');
    
        document.getElementById('modalBody').innerHTML = `
        <table class="historial-table">
          <thead><tr>
            <th>Fecha</th><th>Asistencia</th><th>Credencial</th><th>Uniforme</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>`;
      }
    
      document.getElementById('modalHistorial').classList.add('open');
    }
    
    function closeModal() {
      document.getElementById('modalHistorial').classList.remove('open');
    }
    
    // ---------- EXPORTAR EXCEL ----------
    function exportarExcel() {
      const registros = getRegistros();
      const rows = [['Apellido Paterno', 'Apellido Materno', 'Nombre', 'Grupo', 'Fecha',
                      'Asistencia', 'Credencial', 'Uniforme']];
    
      sortAlumnos(ALUMNOS_BASE).forEach(a => {
        const r = registros.find(r => r.alumnoId === a.id && r.fecha === HOY);
        rows.push([
          a.apPaterno,
          a.apMaterno,
          a.nombre,
          a.grupo,
          r ? r.fecha : 'Sin registro',
          r ? r.asistencia : 'N/A',
          r ? (r.credencial ? 'Sí' : 'No') : 'N/A',
          r ? (r.uniforme ? 'Sí' : 'No') : 'N/A',
        ]);
      });
    
      // Crear CSV como fallback si no hay librería xlsx
      const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `asistencia_${HOY.replace(/\//g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('📥 Archivo Excel descargado');
    }
    
    // ---------- UTILIDADES ----------
    function setPanelHeader(titulo, count) {
      document.getElementById('panelTitle').textContent = titulo;
      document.getElementById('panelCount').textContent =
        count !== null ? `${count} alumno${count !== 1 ? 's' : ''}` : '';
    }
    
    function badgeAsistencia(tipo) {
      const map = {
        'presente': '<span class="badge badge-ok">✓ Presente</span>',
        'retardo':  '<span class="badge badge-retardo">⏰ Retardo</span>',
        'falta':    '<span class="badge badge-falta">✗ Falta</span>',
      };
      return map[tipo] || '';
    }
    
    function badgeAsistenciaText(tipo) {
      const map = { presente: '✓ Presente', retardo: '⏰ Retardo', falta: '✗ Falta' };
      return map[tipo] || tipo;
    }
    
    function emptyState(msg = 'No hay alumnos que coincidan.') {
      return `<div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <p>${msg}</p>
      </div>`;
    }
    
    function animateCards() {
      document.querySelectorAll('.student-card, .register-card, .no-reg-card').forEach((c, i) => {
        c.style.animationDelay = `${i * 40}ms`;
      });
    }
    
    function showToast(msg) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
    
    function mostrarMasInfo(alumnoId) {
      const alumno = ALUMNOS_BASE.find(a => a.id === alumnoId);
      if (!alumno) return;
    
      const historial = getHistorial()
        .filter(h => h.alumnoId === alumnoId)
        .sort((a, b) => {
          const fa = a.fecha.split('/').reverse().join('-');
          const fb = b.fecha.split('/').reverse().join('-');
          return fb.localeCompare(fa);
        });
    
      const totalAsist   = historial.filter(h => h.asistencia === 'presente').length;
      const totalRetardo = historial.filter(h => h.asistencia === 'retardo').length;
      const totalFaltas  = historial.filter(h => h.asistencia === 'falta').length;
      const total        = historial.length;
    
      document.getElementById('modalTitle').textContent = `ℹ️ Perfil — ${nombreCompleto(alumno)}`;
    
      const filasHistorial = historial.length === 0
        ? `<tr><td colspan="4" style="text-align:center;color:#90A4AE;padding:18px;">Sin registros previos</td></tr>`
        : historial.map(h => `
            <tr>
              <td>📅 ${h.fecha}</td>
              <td>${badgeAsistenciaText(h.asistencia)}</td>
              <td>${h.credencial ? '✅ Sí' : '❌ No'}</td>
              <td>${h.uniforme  ? '✅ Sí' : '❌ No'}</td>
            </tr>`).join('');
    
      document.getElementById('modalBody').innerHTML = `
        <div class="info-perfil-grid">
          <div class="info-dato">
            <span class="info-label">Apellido Paterno</span>
            <span class="info-valor">${alumno.apPaterno}</span>
          </div>
          <div class="info-dato">
            <span class="info-label">Apellido Materno</span>
            <span class="info-valor">${alumno.apMaterno}</span>
          </div>
          <div class="info-dato">
            <span class="info-label">Nombre(s)</span>
            <span class="info-valor">${alumno.nombre}</span>
          </div>
          <div class="info-dato">
            <span class="info-label">Grupo</span>
            <span class="info-valor">${alumno.grupo}</span>
          </div>
          <div class="info-dato">
            <span class="info-label">CURP</span>
            <span class="info-valor">${alumno.curp || '<em style="color:#90A4AE">No registrada</em>'}</span>
          </div>
          <div class="info-dato">
            <span class="info-label">Núm. de Control</span>
            <span class="info-valor">${alumno.numeroControl || '<em style="color:#90A4AE">No registrado</em>'}</span>
          </div>
        </div>
    
        <div class="info-stats-row">
          <div class="info-stat info-stat-ok">
            <span class="info-stat-num">${totalAsist}</span>
            <span class="info-stat-lbl">✓ Presentes</span>
          </div>
          <div class="info-stat info-stat-warn">
            <span class="info-stat-num">${totalRetardo}</span>
            <span class="info-stat-lbl">⏰ Retardos</span>
          </div>
          <div class="info-stat info-stat-danger">
            <span class="info-stat-num">${totalFaltas}</span>
            <span class="info-stat-lbl">✗ Faltas</span>
          </div>
          <div class="info-stat info-stat-neutral">
            <span class="info-stat-num">${total}</span>
            <span class="info-stat-lbl">📋 Total días</span>
          </div>
        </div>
    
        <h4 style="margin:18px 0 10px;font-family:'Rajdhani',sans-serif;color:#1565C0;font-size:1.05rem;letter-spacing:.5px;">
          📜 Historial de asistencias
        </h4>
        <table class="historial-table">
          <thead><tr>
            <th>Fecha</th><th>Asistencia</th><th>Credencial</th><th>Uniforme</th>
          </tr></thead>
          <tbody>${filasHistorial}</tbody>
        </table>`;
    
      document.getElementById('modalHistorial').classList.add('open');
    }
    
    function mostrarFormularioAlumno() {
      document.getElementById('modalAlumno').classList.add('open');
    }
    
    function cerrarModalAlumno() {
      document.getElementById('modalAlumno').classList.remove('open');
    }
    
    function guardarNuevoAlumno() {
      const apPaterno   = document.getElementById('nuevoApPaterno').value.trim();
      const apMaterno   = document.getElementById('nuevoApMaterno').value.trim();
      const nombre      = document.getElementById('nuevoNombre').value.trim();
      const grupo       = document.getElementById('nuevoGrupo').value.trim();
      const curp        = document.getElementById('nuevoCurp').value.trim().toUpperCase();
      const control     = document.getElementById('nuevoControl').value.trim();
    
      if (!apPaterno || !apMaterno || !nombre) {
        showToast('⚠️ Completa al menos apellidos y nombre');
        return;
      }
    
      agregarAlumno(apPaterno, apMaterno, nombre, grupo, curp, control);
      cerrarModalAlumno();
    
      // Limpiar campos
      ['nuevoApPaterno','nuevoApMaterno','nuevoNombre','nuevoGrupo','nuevoCurp','nuevoControl']
        .forEach(id => document.getElementById(id).value = '');
    
      showToast('✅ Alumno agregado correctamente');
      showPanel('todosRegistrados');
    }
    
    function borrarAlumno(id) {
      const alumno = ALUMNOS_BASE.find(a => a.id === id);
      if (!alumno) return;
    
      const confirmar = confirm(`¿Deseas eliminar a ${nombreCompleto(alumno)}?`);
    
      if (!confirmar) return;
    
      eliminarAlumno(id);
    
      showToast('🗑 Alumno eliminado correctamente');
    
      showPanel(currentPanel || 'todosRegistrados');
    }
    // ============================================================
    // DATA.JS — Base de datos de alumnos y asistencias
    // ============================================================
    
    // Fecha actual para registros del día
    const HOY = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
    
    // ---- CATÁLOGO DE ALUMNOS ----
    // Formato: { id, apPaterno, apMaterno, nombre, grupo }
    // Grupos: 6A2, 6A1, 5B2, 5B1, 4C2, 4C1, 3D2, 3D1, 2E2, 2E1, 1F2, 1F1

      { id: 23, apPaterno: "Sánchez",     apMaterno: "Vargas",    nombre: "Arturo",    grupo: "1F2" },

      { id: 26, apPaterno: "Velázquez",   apMaterno: "Aguilar",   nombre: "Carmen",    grupo: "6A1" },
      { id: 27, apPaterno: "Margarito",   apMaterno: "Camilo",    nombre: "Javier",    grupo: "5B2" },
      { id: 28, apPaterno: "Castillo",    apMaterno: "Bernal",    nombre: "Gabriela",  grupo: "5B1" },
      { id: 29, apPaterno: "Delgado",     apMaterno: "Campos",    nombre: "Óscar",     grupo: "4C2" },
      { id: 30, apPaterno: "Gutiérrez",   apMaterno: "Delgado",   nombre: "Patricia",  grupo: "4C1" },
    ];
    
    // ---- REGISTROS DEL DÍA ----
    // Se almacena en localStorage. Estructura:
    // { alumnoId, fecha, asistencia: 'presente'|'retardo'|'falta', credencial: bool, uniforme: bool }
    function getRegistros() {
      try { return JSON.parse(localStorage.getItem('registros') || '[]'); } catch(e) { return []; }
    }
    
    function setRegistros(arr) {
      localStorage.setItem('registros', JSON.stringify(arr));
    }
    
    function getHistorial() {
      try { return JSON.parse(localStorage.getItem('historial') || '[]'); } catch(e) { return []; }
    }
    
    function setHistorial(arr) {
      localStorage.setItem('historial', JSON.stringify(arr));
    }
    
    // Obtener registro de HOY para un alumno
    function getRegistroHoy(alumnoId) {
      return getRegistros().find(r => r.alumnoId === alumnoId && r.fecha === HOY) || null;
    }
    
    // Guardar o actualizar registro del día
    function guardarRegistro(alumnoId, asistencia, credencial, uniforme) {
      let registros = getRegistros();
      let historial = getHistorial();
      const idx = registros.findIndex(r => r.alumnoId === alumnoId && r.fecha === HOY);
      const reg = { alumnoId, fecha: HOY, asistencia, credencial, uniforme };
    
      if (idx >= 0) { registros[idx] = reg; }
      else { registros.push(reg); }
      setRegistros(registros);
    
      // También actualizar historial
      const hidx = historial.findIndex(h => h.alumnoId === alumnoId && h.fecha === HOY);
      if (hidx >= 0) { historial[hidx] = reg; }
      else { historial.push(reg); }
      setHistorial(historial);
    }
    
    // Nombre completo de alumno
    function nombreCompleto(a) {
      return `${a.apPaterno} ${a.apMaterno}, ${a.nombre}`;
    }
    
    // Ordenar alfabéticamente por apPaterno, apMaterno, nombre
    function sortAlumnos(arr) {
      return [...arr].sort((a, b) => {
        const ka = `${a.apPaterno}${a.apMaterno}${a.nombre}`;
        const kb = `${b.apPaterno}${b.apMaterno}${b.nombre}`;
        return ka.localeCompare(kb, 'es');
      });
    }
    
    // Ordenar por semestre (grupo) desc (6→1) y terminación 2 antes 1
    function sortPorSemestre(arr) {
      const semNum = g => parseInt(g[0]);
      const termNum = g => parseInt(g[g.length - 1]);
      return [...arr].sort((a, b) => {
        const sa = semNum(a.grupo), sb = semNum(b.grupo);
        if (sb !== sa) return sb - sa;
        return termNum(b.grupo) - termNum(a.grupo);
      });
    }
    
    // Inicializar datos demo para hoy (algunos alumnos ya registrados)
    function initDemoData() {
      if (getRegistros().length > 0) return; // ya hay datos
      const demos = [
        { id: 1, asistencia: 'presente', credencial: false, uniforme: true },
        { id: 2, asistencia: 'presente', credencial: true,  uniforme: false },
        { id: 3, asistencia: 'retardo',  credencial: true,  uniforme: true },
        { id: 4, asistencia: 'presente', credencial: true,  uniforme: true },
        { id: 5, asistencia: 'falta',    credencial: false, uniforme: false },
        { id: 7, asistencia: 'presente', credencial: false, uniforme: false },
        { id: 9, asistencia: 'presente', credencial: true,  uniforme: true },
        { id: 11, asistencia: 'retardo', credencial: false, uniforme: true },
        { id: 13, asistencia: 'presente', credencial: true, uniforme: true },
        { id: 15, asistencia: 'presente', credencial: true, uniforme: false },
        { id: 17, asistencia: 'presente', credencial: false, uniforme: true },
        { id: 19, asistencia: 'falta',   credencial: false, uniforme: false },
        { id: 21, asistencia: 'presente', credencial: true, uniforme: true },
        { id: 25, asistencia: 'presente', credencial: true, uniforme: true },
      ];
      demos.forEach(d => guardarRegistro(d.id, d.asistencia, d.credencial, d.uniforme));
    }
    
    // ---- PERSISTENCIA DE ALUMNOS EN LOCALSTORAGE ----
    function guardarAlumnos() {
      localStorage.setItem('alumnos_base', JSON.stringify(ALUMNOS_BASE));
    }
    
    function cargarAlumnos() {
      try {
        const guardados = JSON.parse(localStorage.getItem('alumnos_base') || 'null');
        if (guardados && guardados.length > 0) {
          ALUMNOS_BASE.length = 0;
          guardados.forEach(a => ALUMNOS_BASE.push(a));
        }
      } catch(e) { /* usar datos por defecto */ }
    }
    
    function agregarAlumno(apPaterno, apMaterno, nombre, grupo, curp, numeroControl) {
      const nuevoAlumno = {
        id: Date.now(),
        apPaterno: apPaterno.trim(),
        apMaterno: apMaterno.trim(),
        nombre: nombre.trim(),
        grupo: grupo.trim() || 'N/A',
        curp: curp.trim(),
        numeroControl: numeroControl.trim()
      };
      ALUMNOS_BASE.push(nuevoAlumno);
      guardarAlumnos();
      return nuevoAlumno;
    }
    
    function eliminarAlumno(id) {
      const idx = ALUMNOS_BASE.findIndex(a => a.id === id);
      if (idx !== -1) ALUMNOS_BASE.splice(idx, 1);
      guardarAlumnos();
    
      let registros = getRegistros().filter(r => r.alumnoId !== id);
      setRegistros(registros);
    
      let historial = getHistorial().filter(h => h.alumnoId !== id);
      setHistorial(historial);
    }
    
    // Cargar alumnos persistidos antes de inicializar demo
    cargarAlumnos();
    initDemoData();
  </script>
